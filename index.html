<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Download Center</title>

<style>

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}

body {

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #080808;

    color: #fff;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 680px;

    text-align: center;

}

.logo {

    font-size: 14px;

    color: #777;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 35px;

}

h1 {

    font-size: clamp(36px, 8vw, 58px);

    font-weight: 800;

    letter-spacing: -2px;

    margin-bottom: 15px;

}

.description {

    color: #888;

    font-size: 16px;

    margin-bottom: 45px;

}

.file-card {

    background: #141414;

    border: 1px solid #292929;

    border-radius: 22px;

    padding: 25px;

    margin-bottom: 25px;

    text-align: left;

}

.file-icon {

    font-size: 35px;

    margin-bottom: 15px;

}

.filename {

    font-size: 19px;

    font-weight: 700;

    word-break: break-word;

}

.filesize {

    color: #777;

    font-size: 13px;

    margin-top: 7px;

}

.download {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 14px;

    width: 100%;

    min-height: 145px;

    background: #fff;

    color: #080808;

    text-decoration: none;

    border-radius: 22px;

    font-size: 30px;

    font-weight: 800;

    transition: .2s ease;

}

.download:hover {

    background: #dcdcdc;

    transform: translateY(-4px);

}

.download:active {

    transform: scale(.98);

}

.download.disabled {

    opacity: .4;

    pointer-events: none;

}

.note {

    color: #555;

    font-size: 12px;

    margin-top: 30px;

}

footer {

    margin-top: 60px;

    color: #444;

    font-size: 12px;

}

</style>

</head>

<body>

<div class="container">

    <div class="logo">DOWNLOAD CENTER</div>

    <h1>Your file is ready.</h1>

    <p class="description">

        Download the file using the button below.

    </p>

    <div class="file-card">

        <div class="file-icon">📦</div>

        <div class="filename">Playport.ipa</div>

        <div class="filesize">1.25 GB · IPA File</div>

    </div>

    <a

        class="download"

        id="downloadButton"

        href="YOUR_GITHUB_RELEASE_URL"

    >

        ↓ DOWNLOAD

    </a>

    <p class="note">

        Download hosted securely through GitHub Releases.

    </p>

    <footer>

        Powered by GitHub Pages

    </footer>

</div>

</body>

</html>
