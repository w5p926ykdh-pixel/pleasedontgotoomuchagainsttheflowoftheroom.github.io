<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>File Download</title>

<style>

* {

    box-sizing: border-box;

}

body {

    margin: 0;

    min-height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #0b0b0d;

    color: white;

    font-family: Arial, sans-serif;

    text-align: center;

}

.container {

    width: 90%;

    max-width: 650px;

}

h1 {

    font-size: 42px;

    margin-bottom: 12px;

}

p {

    color: #999;

    margin-bottom: 40px;

}

.download {

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    min-height: 160px;

    background: white;

    color: black;

    border-radius: 24px;

    text-decoration: none;

    font-size: 32px;

    font-weight: bold;

    transition: 0.2s;

}

.download:hover {

    background: #dcdcdc;

    transform: scale(1.025);

}

.download:active {

    transform: scale(0.98);

}

footer {

    margin-top: 35px;

    color: #555;

    font-size: 13px;

}

</style>

</head>

<body>

<div class="container">

    <h1>Download Center</h1>

    <p>Your file is ready to download.</p>

    <a class="download" href="./yourfile.ipa" download>

        ↓ DOWNLOAD

    </a>

    <footer>

        Powered by GitHub Pages

    </footer>

</div>

</body>

</html>
